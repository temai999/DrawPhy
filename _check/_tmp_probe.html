<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DrawPhy 交互自检</title>
<link rel="stylesheet" href="../assets/editor.css">
<style>
  #board { position: absolute; left: 0; top: 0; width: 900px; height: 600px; }
  #stageWrap { position: relative; width: 900px; height: 600px; }
  #props, #partGrid, #toolList, #partTabs { position: absolute; left: -9999px; }
  pre { position: absolute; left: 0; top: 620px; font-size: 13px; }
</style>
</head>
<body>
<div id="stageWrap">
  <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
</div>
<input id="inlineText" class="inline-text" hidden>
<div id="toast"></div>
<div id="hint"></div>
<span id="zoomLabel"></span>
<div id="toolList"></div>
<div id="partDrawer" class="open"><div class="drawer-head"><input id="partSearch"></div><div class="drawer-body"><nav id="drawerCats"></nav><div id="drawerGrid"></div></div></div>
<div id="drawerMask"></div>
<button id="btnParts"></button><button id="drawerClose"></button>
<div id="props"></div>
<button id="btnUndo"></button><button id="btnRedo"></button><button id="btnFit"></button>
<button id="btnNew"></button><button id="btnOpen"></button><button id="btnSave"></button>
<button id="btnPng"></button><button id="btnSvg"></button><button id="btnCopy"></button>
<input type="checkbox" id="bgToggle" checked><input type="checkbox" id="snapToggle" checked>
<input type="file" id="fileInput" hidden>
<pre id="r"></pre>

<script src="../src/core/config.js"></script>
<script src="../src/core/style.js"></script>
<script src="../src/core/module-wrap.js"></script>
<script src="../src/core/registry.js"></script>
<script src="../src/core/eventbus.js"></script>
<script src="../src/core.js"></script>
<script src="../src/modules/primitives/rect.js"></script>
<script src="../src/modules/primitives/arrow.js"></script>
<script src="../src/modules/primitives/line.js"></script>
<script src="../src/modules/primitives/circle.js"></script>
<script src="../src/modules/primitives/ellipse.js"></script>
<script src="../src/modules/primitives/polyline.js"></script>
<script src="../src/modules/primitives/arc.js"></script>
<script src="../src/modules/primitives/path.js"></script>
<script src="../src/modules/primitives/text.js"></script>
<script src="../src/modules/primitives/textbox.js"></script>
<script src="../src/modules/primitives/callout.js"></script>
<script src="../src/modules/primitives/dim.js"></script>
<script src="../src/modules/primitives/angle.js"></script>
<script src="../src/modules/host/part.js"></script>
<script src="../src/modules/host/point.js"></script>
<script src="../src/parts.js"></script>
<script src="../src/render.js"></script>
<script src="../src/ui/tools-data.js"></script>
<script src="../src/ui/help.js"></script>
<script src="../src/ui/shapes.js"></script>
<script src="../src/ui.js"></script>
<script src="../src/io.js"></script>
<script>
(function(){
  const out=[];
  const board=document.getElementById('board');
  DP.state.view={x:0,y:0,k:1}; DP.state.page={w:900,h:600,bg:'#fff',grid:false};
  DP.state.snap={grid:false,gridSize:20,anchors:false}; DP.state.objects=[]; DP.state.selection=new Set();
  DP.ui.init();
  function pe(type,wx,wy){const r=board.getBoundingClientRect();
    board.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,pointerId:1,pointerType:'mouse',button:0,buttons:type==='pointerup'?0:1,clientX:r.left+wx,clientY:r.top+wy}));}
  function click(x,y){pe('pointerdown',x,y);pe('pointerup',x,y);}
  DP.ui.setTool('textbox');
  click(300,200);
  out.push('tool='+DP.state.tool+' n='+DP.state.objects.length+' obj='+JSON.stringify(DP.state.objects[0]));
  out.push('helpLen='+(DP.ui.helpHtml?DP.ui.helpHtml().length:'none'));
  out.push('helpHas='+/曲线把柄/.test(DP.ui.helpHtml?DP.ui.helpHtml():''));
  document.getElementById('r').textContent=out.join('\n');
})();
</script></body></html>
