<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>png test</title></head>
<body>
<pre id="r">running…</pre>
<script src="../src/core/config.js"></script>
<script src="../src/core/style.js"></script>
<script src="../src/core/module-wrap.js"></script>
<script src="../src/core/registry.js"></script>
<script src="../src/core/eventbus.js"></script>
<script src="../src/core.js"></script>
<script src="../src/modules/primitives/rect.js"></script>
<script src="../src/modules/primitives/arrow.js"></script>
<script src="../src/parts.js"></script>
<script src="../src/render.js"></script>
<script>window.DP = window.DP || {}; DP.ui = { toast: function () {}, autosave: function () {} };</script>
<script src="../src/io.js"></script>
<script>
  (async function () {
    const res = [];
    try {
      DP.state.objects = [
        { id: 'l1', type: 'line', x1: 10, y1: 10, x2: 300, y2: 200, style: DP.state.style },
        { id: 't1', type: 'text', x: 40, y: 60, text: 'v_{0}=x^{2}', size: 20, anchor: 'start', style: DP.state.style },
        { id: 'p1', type: 'part', partId: 'battery', x: 100, y: 120, s: 2, rot: 0, style: DP.state.style },
        { id: 'r1', type: 'rect', x: 40, y: 200, w: 100, h: 50, rx: 8, style: DP.state.style },
        { id: 'a1', type: 'arrow', x1: 180, y1: 220, x2: 340, y2: 270, style: Object.assign({}, DP.state.style, { arrow: 'both' }) },
      ];
      DP.state.page = { w: 400, h: 300, bg: '#ffffff', grid: true };
      const blob = await DP.io.pngBlob(2);
      res.push((blob && blob.size > 2000 && blob.type === 'image/png' ? 'PASS' : 'FAIL') +
        ' PNG 光栅化  [' + (blob ? blob.size + 'B ' + blob.type : 'null') + ']');
      const svg = DP.io.svgString({ transparent: false });
      res.push((svg.indexOf('<svg') === 0 && svg.indexOf('viewBox') > -1 ? 'PASS' : 'FAIL') + ' SVG 序列化');
      document.title = 'PNGDONE';
    } catch (e) {
      res.push('FAIL 异常 [' + (e && e.message) + ']');
      document.title = 'PNGERR';
    }
    document.getElementById('r').textContent = res.join('\n');
  })();
</script>
</body>
</html>
