<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DrawPhy 路 绉戝缁樺浘鏉?/title>
<link rel="stylesheet" href="assets/editor.css">
</head>
<body>
<div id="app">
  <!-- EE 鍙屽眰椤舵爮锛氱涓€灞傛爣绛鹃〉 -->
  <header id="topbar">
    <div class="brand"><b>DrawPhy</b></div>
    <nav id="tabs">
      <button data-tab="file">鏂囦欢</button>
      <button data-tab="draw" class="on">缁樺浘</button>
      <button data-tab="part">閮ㄤ欢</button>
      <button data-tab="arrange">鎺掑垪</button>
      <button data-tab="view">瑙嗗浘</button>
    </nav>
    <div class="group right">
      <span id="zoomLabel">17%</span>
    </div>
  </header>

  <!-- 绗簩灞傦細妯悜鍒嗙粍宸ュ叿甯?-->
  <div id="ribbon">
    <!-- 鏂囦欢锛氱珫鎺掑垎绫绘寜閽紝鐐瑰嚮灏卞湴灞曞紑锛堜笌缁樺浘/閮ㄤ欢鍚屾満鍒讹級 -->
    <div class="rgroup" data-r="file" hidden="">
      <div class="rcell partcats" id="fileCatBar">
        <button data-cat="file.action" style="background:#2563eb"><svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"></path><path d="M14 3v5h5"></path><path d="M12 12v6M9 15h6"></path></svg><span>鏂囦欢鎿嶄綔</span></button>
        <button data-cat="file.export" style="background:#10b981"><svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10"></path><path d="M8 10l4 4 4-4"></path><path d="M5 19h14"></path></svg><span>瀵煎嚭</span></button>
        <button data-cat="file.sample" style="background:#f59e0b"><svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="2"></rect><path d="M10 9.5v5l4.5-2.5z" fill="currentColor" stroke="none"></path></svg><span>绀轰緥</span></button>
        <button data-cat="file.help" style="background:#8b5cf6"><svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.7 9.2a2.4 2.4 0 1 1 3.3 2.2c-.7.3-1 .8-1 1.6"></path><circle cx="12" cy="16.8" r=".5" fill="currentColor"></circle></svg><span>甯姪</span></button>
      </div>
    </div>

    <!-- 缁樺浘锛氱珫鎺掑垎绫绘寜閽紝鐐瑰嚮灏卞湴灞曞紑锛堜笌閮ㄤ欢鍚屾牸寮忥級 -->
    <div class="rgroup" data-r="draw" hidden="">
      <div class="rcell partcats" id="drawCatBar">
        <button data-cat="shape" class="on"><svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3.5" y="3.5" width="11" height="11" rx="1.5"></rect><circle cx="16" cy="16" r="4.2"></circle></svg><span>鍩烘湰鍥惧舰</span></button><div id="ribInline" data-key="shape"><div class="part-grid3"><button class="tool rib-part" data-tool="select" title="閫夋嫨锛圴锛?>
      <span class="part-thumb"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4 L6 17 L9.5 13.5 L12 19.5 L14.5 18.5 L12 12.5 L17 12.5 Z" fill="currentColor" stroke="none"></path></svg></span><span class="part-name">閫夋嫨</span></button><button class="tool rib-part" data-tool="line" title="绾挎锛圠锛?>
      <span class="part-thumb"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="20" x2="20" y2="4"></line></svg></span><span class="part-name">绾挎</span></button><button class="tool rib-part" data-tool="arrow" title="绠ご锛圓锛?>
      <span class="part-thumb"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="19" x2="17" y2="6"></line><path d="M17 6 L10 7 L15 12 Z" fill="currentColor" stroke="none"></path></svg></span><span class="part-name">绠ご</span></button><button class="tool rib-part" data-tool="darrow" title="鍙岀澶达紙W锛?>
      <span class="part-thumb"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><path d="M5 12 L11 9.5 L11 14.5 Z" fill="currentColor" stroke="none"></path><path d="M19 12 L13 9.5 L13 14.5 Z" fill="currentColor" stroke="none"></path></svg></span><span class="part-name">鍙岀澶?/span></button><button class="tool rib-part" data-tool="polyline" title="鎶樼嚎锛圥锛?>
      <span class="part-thumb"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4,17 9,9 14,14 20,6"></polyline></svg></span><span class="part-name">鎶樼嚎</span></button><button class="tool rib-part" data-tool="polygon" title="澶氳竟褰紙G锛?>
      <span class="part-thumb"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5 L20 19 L4 19 Z"></path></svg></span><span class="part-name">澶氳竟褰?/span></button><button class="tool rib-part" data-tool="rect" title="鐭╁舰锛圧锛?>
      <span class="part-thumb"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="7" width="14" height="10" rx="1"></rect></svg></span><span class="part-name">鐭╁舰</span></button><button class="tool rib-part" data-tool="ellipse" title="妞渾锛圗锛?>
      <span class="part-thumb"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="12" rx="8" ry="5.5"></ellipse></svg></span><span class="part-name">妞渾</span></button><button class="tool rib-part" data-tool="circle" title="鍦嗭紙C锛?>
      <span class="part-thumb"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7"></circle></svg></span><span class="part-name">鍦?/span></button><button class="tool rib-part" data-tool="arc" title="鍦嗗姬锛圲锛?>
      <span class="part-thumb"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 18 A 8 8 0 0 1 18 6"></path></svg></span><span class="part-name">鍦嗗姬</span></button><button class="tool rib-part" data-tool="freehand" title="寰掓墜锛團锛?>
      <span class="part-thumb"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15 Q 8 7 12 12 T 20 10"></path></svg></span><span class="part-name">寰掓墜</span></button><button class="tool rib-part" data-tool="bezier" title="璐濆灏旓紙J锛?>
      <span class="part-thumb"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19 Q 11 3 20 7"></path><circle cx="4" cy="19" r="1.5"></circle><circle cx="20" cy="7" r="1.5"></circle><path d="M4 19 L11 11 L20 7" stroke-dasharray="2 2"></path></svg></span><span class="part-name">璐濆灏?/span></button><button class="tool rib-part" data-tool="point" title="鐐癸紙O锛?>
      <span class="part-thumb"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"></circle></svg></span><span class="part-name">鐐?/span></button><button class="tool rib-part" data-tool="roundrect" title="鍦嗚鐭╁舰锛圖锛?>
      <span class="part-thumb"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="10" rx="4"></rect></svg></span><span class="part-name">鍦嗚鐭╁舰</span></button><button class="tool rib-part" data-tool="func" title="鍑芥暟鍥惧儚锛圚锛?>
      <span class="part-thumb"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17 Q 8 4 12 12 T 21 7"></path><line x1="3" y1="20" x2="21" y2="20" stroke-dasharray="2 2"></line></svg></span><span class="part-name">鍑芥暟鍥惧儚</span></button></div></div>
        <button data-cat="text"><svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6h16M12 6v13M8.5 19h7"></path></svg><span>鏂囧瓧涓庢爣娉?/span></button>
        <button data-cat="edit"><svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.2-4.2L15 6l3 3L8.2 18.8z"></path><path d="M13.5 7.5l3 3"></path></svg><span>缂栬緫宸ュ叿</span></button>
        <button data-cat="style"><svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.6 0 2.2-1.1 2.2-2.2 0-1.4 1.1-2 2.4-2H18a4 4 0 0 0 4-4c0-5-4.5-7.8-10-7.8z"></path><circle cx="7.5" cy="11" r="1.1"></circle><circle cx="12" cy="8" r="1.1"></circle><circle cx="16.5" cy="11" r="1.1"></circle></svg><span>鏍峰紡</span></button>
      </div>
    </div>

    <!-- 閮ㄤ欢锛氱珫鎺掑垎绫绘寜閽紝鐐瑰嚮灏卞湴灞曞紑 -->
    <div class="rgroup" data-r="part" hidden="">
      <div class="rcell partcats" id="partCatBar">
        <button data-cat="鐢靛"><svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M13 2L4 14h6l-1 8 9-12h-6z"></path></svg><span>鐢靛</span></button>
        <button data-cat="鍏夊"><svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="12" cy="12" rx="3" ry="9"></ellipse><path d="M3 12h3M18 12h3M12 3v3M12 18v3"></path></svg><span>鍏夊</span></button>
        <button data-cat="鍔涘"><svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 18h16M8 18V6l8 4"></path></svg><span>鍔涘</span></button>
        <button data-cat="鐑"><svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 22a6 6 0 006-6c0-4-6-9-6-12 0 3-6 5-6 9a6 6 0 006 6z"></path></svg><span>鐑</span></button>
        <button data-cat="浠櫒"><svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="13" r="7"></circle><path d="M12 13l4-4M9 3h6"></path></svg><span>浠櫒</span></button>
        <button data-cat="甯哥敤鍥惧舰"><svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="7" height="7" rx="1"></rect><circle cx="16.5" cy="16.5" r="3.5"></circle></svg><span>甯哥敤鍥惧舰</span></button>
        <button data-cat="杩炴帴绾?><svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="5" cy="12" r="2.5"></circle><circle cx="19" cy="5" r="2.5"></circle><circle cx="19" cy="19" r="2.5"></circle><path d="M7.5 12h9M17 6.5l-2 4M17 17.5l-2-4"></path></svg><span>杩炴帴绾?/span></button>
        <button data-cat="灏哄"><svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 8l13 13M5 6l2 2M8 5l2 2M11 8l2 2M14 11l2 2"></path><path d="M14 21l7-7"></path></svg><span>灏哄</span></button>
        <button data-cat="鐜被"><svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg><span>鐜被</span></button>
        <button data-cat="鍖栧閿?><svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="7" r="3"></circle><circle cx="18" cy="17" r="3"></circle><path d="M9 11l6-3M9 13l6 3"></path></svg><span>鍖栧閿?/span></button>
        <button data-cat="閫氱敤"><svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M4 12h16M12 4v16"></path></svg><span>閫氱敤</span></button>
      </div>
    </div>

    <!-- 鎺掑垪锛氱珫鎺掑垎绫绘寜閽紝鐐瑰嚮灏卞湴灞曞紑 -->
    <div class="rgroup" data-r="arrange" hidden="">
      <div class="rcell partcats" id="arrangeCatBar">
        <button data-cat="align.group" style="background:#f43f5e"><svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="7" height="7" rx="1"></rect><path d="M15 9V5H5v10h4"></path><path d="M9 15v4h10V9h-4"></path></svg><span>缁勫悎</span></button>
        <button data-cat="align.layer" style="background:#0ea5e9"><svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16"></path><path d="M8.5 8L12 4.5 15.5 8"></path><path d="M8.5 16L12 19.5 15.5 16"></path></svg><span>灞傜骇</span></button>
        <button data-cat="align.transform" style="background:#14b8a6"><svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"></path><path d="M20 3v4h-4"></path></svg><span>鍙樻崲</span></button>
        <button data-cat="align.align" style="background:#6366f1"><svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h13"></path><path d="M7 3v18"></path></svg><span>瀵归綈</span></button>
      </div>
    </div>

    <!-- 瑙嗗浘锛氱珫鎺掑垎绫绘寜閽紝鐐瑰嚮灏卞湴灞曞紑 -->
    <div class="rgroup" data-r="view" hidden="">
      <div class="rcell partcats" id="viewCatBar">
        <button data-cat="view.display" style="background:#22c55e"><svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"></path><circle cx="12" cy="12" r="2.6"></circle></svg><span>鏄剧ず</span></button>
        <button data-cat="view.zoom" style="background:#f97316"><svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6"></circle><path d="M15 15l5.5 5.5"></path><path d="M10.5 8v5M8 10.5h5"></path></svg><span>缂╂斁</span></button>
      </div>
    </div>
  </div>

  <main>
    <section class="stage">
