<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DrawPhy 部件总览（114 件）</title>
<style>
  body { margin: 0; padding: 20px 24px; background: #fff; color: #24313c;
         font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { font-size: 12px; color: #7a8b99; margin: 0 0 18px; }
  h2 { font-size: 13px; margin: 22px 0 10px; padding-bottom: 5px; border-bottom: 1px solid #e6ecf1; color: #0f6f57; }
  .grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 10px; }
  .it { border: 1px solid #e7edf2; border-radius: 8px; padding: 8px 4px 6px; text-align: center; }
  .it .thumb { height: 78px; display: flex; align-items: center; justify-content: center; }
  .it .nm { font-size: 11px; color: #5b6b79; margin-top: 4px; }
  .it .id { font-size: 9px; color: #a4b0bb; }
</style>
</head>
<body>
<h1>部件库总览</h1>
<p class="sub" id="sub">按分类列出全部部件，用于人工核对符号是否画得对</p>
<div id="out"></div>
<script src="../src/core.js"></script>
<script src="../src/parts.js"></script>
<script src="../src/render.js"></script>
<script src="../src/io.js"></script>
<script>
(function () {
  const out = document.getElementById('out');
  const cats = DP.parts.cats;
  let html = '';
  let total = 0;
  for (const c of cats) {
    const items = DP.parts.list.filter((p) => p.cat === c);
    total += items.length;
    html += `<h2>${c} · ${items.length} 件</h2><div class="grid">`;
    for (const p of items) {
      html += `<div class="it"><div class="thumb">${DP.render.partThumb(p.id, 64)}</div>
        <div class="nm">${p.name}</div><div class="id">${p.id}</div></div>`;
    }
    html += '</div>';
  }
  out.innerHTML = html;
  document.getElementById('sub').textContent =
    `共 ${total} 件 / ${cats.length} 类；缩略图由 render.js 实时生成（用于人工核对，不参与运行时逻辑）`;
})();
</script>
</body>
</html>
